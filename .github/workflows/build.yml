name: Test and build portable FRM

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: macos-14
            label: macOS-arm64
          - os: macos-15-intel
            label: macOS-x64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/build.py
      - name: Smoke test Windows portable executable
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/FRM/FRM.exe -ArgumentList '--self-test', 'artifacts/portable-smoke.json' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Portable smoke test failed' }
          Get-Content artifacts/portable-smoke.json
      - name: Smoke test macOS portable executable
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: dist/FRM.app/Contents/MacOS/FRM --self-test artifacts/portable-smoke.json
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/FRM -DestinationPath "FRM-${{ github.ref_name }}-${{ matrix.label }}.zip"
      - name: Package macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/FRM.app "FRM-${{ github.ref_name }}-${{ matrix.label }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: FRM-${{ matrix.label }}
          path: FRM-*.zip
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "$TAG" *.zip SHA256SUMS.txt --prerelease --verify-tag --title "FRM $TAG — Preview" --notes "Portable preview builds for Windows x64, Mac Apple Silicon and Mac Intel. Extract the complete package. Unsigned; see README for playback/color limitations and third-party notices. Video is silent; output is an 8-bit preview, not a mastering reference."
