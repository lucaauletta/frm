name: Test and build portable FRM

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: ubuntu-24.04
            label: Linux-x64
          - os: macos-14
            label: macOS-arm64
          - os: macos-15-intel
            label: macOS-x64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/build.py
      - name: Smoke test Windows portable executable
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/FRM-Portable.exe -ArgumentList '--self-test', 'artifacts/portable-smoke.json' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Portable smoke test failed' }
          Get-Content artifacts/portable-smoke.json
      - name: Smoke test macOS portable executable
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: dist/FRM.app/Contents/MacOS/FRM --self-test artifacts/portable-smoke.json
      - name: Smoke test Linux executable
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: dist/FRM-Portable --self-test artifacts/portable-smoke.json
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Verify installer upgrade and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler /DAppVersion=0.2.99 "/O$env:GITHUB_WORKSPACE/build/installer-test" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade fixture build failed' }
          $destination = Join-Path $env:RUNNER_TEMP 'FRM-installed-test'
          $old = Start-Process build/installer-test/FRM-v0.2.99-Windows-x64-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$destination" -Wait -PassThru -WindowStyle Hidden
          if ($old.ExitCode -ne 0) { throw 'Initial installation failed' }
          $new = Start-Process artifacts/FRM-v0.3.1-Windows-x64-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru -WindowStyle Hidden
          if ($new.ExitCode -ne 0) { throw 'Upgrade failed' }
          $entries = @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object PSChildName -eq '{39F1E96A-B88B-4E5E-9BCB-EF4D3C4C9EC2}_is1')
          $entries | Select-Object DisplayName, DisplayVersion, InstallLocation | Format-List
          if ($entries.Count -ne 1 -or $entries[0].DisplayVersion -ne '0.3.1') { throw 'Upgrade identity/version incorrect' }
          $smoke = Start-Process "$destination/FRM.exe" -ArgumentList '--self-test', 'artifacts/installed-smoke.json' -Wait -PassThru -WindowStyle Hidden
          if ($smoke.ExitCode -ne 0) { throw 'Installed app failed' }
          $uninstall = Start-Process "$destination/unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$destination/FRM.exe")) { throw 'Uninstall failed' }
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/FRM-Portable.exe "artifacts/FRM-${{ github.ref_name }}-Windows-x64-Portable.exe"
      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -czf "artifacts/FRM-${{ github.ref_name }}-Linux-x64.tar.gz" -C dist FRM-Portable
      - name: Package macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/FRM.app "artifacts/FRM-${{ github.ref_name }}-${{ matrix.label }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: FRM-${{ matrix.label }}
          path: |
            artifacts/FRM-*.zip
            artifacts/FRM-*.exe
            artifacts/FRM-*.tar.gz
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum FRM-* > SHA256SUMS.txt
          gh release create "$TAG" FRM-* SHA256SUMS.txt --prerelease --verify-tag --title "FRM $TAG — Preview" --notes "Windows single-file portable EXE and upgrade-aware per-user installer; Linux x64 portable executable (Ubuntu 24.04 baseline); Mac Apple Silicon and Intel apps. Source and notices are included. Optional update checks in Help. Unsigned preview, silent 8-bit viewing output. See README for system requirements and limitations."
